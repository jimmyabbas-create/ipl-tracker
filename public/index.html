<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0a0c10">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>IPL 2026 – Total Runs by Team</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=JetBrains+Mono:wght@400;600;700&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{--bg:#0a0c10;--card:#12151c;--border:#1e2230;--text:#e2e4ea;--dim:#6b7084;--accent:#f97316;--glow:rgba(249,115,22,.15);--gold:#fbbf24;--silver:#94a3b8;--bronze:#d97706;--green:#22c55e;--red:#ef4444}
  *{margin:0;padding:0;box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{background:var(--bg);color:var(--text);font-family:'Outfit',system-ui,sans-serif;min-height:100vh;min-height:100dvh;-webkit-font-smoothing:antialiased}
  .orb{position:fixed;border-radius:50%;filter:blur(110px);opacity:.06;pointer-events:none;z-index:0}
  .oa{width:420px;height:420px;background:#f97316;top:-80px;right:-80px}
  .ob{width:350px;height:350px;background:#3b82f6;bottom:-120px;left:-60px}
  .w{position:relative;z-index:1;max-width:520px;margin:0 auto;padding:28px 16px 48px}
  header{text-align:center;margin-bottom:24px}
  .pill{display:inline-flex;align-items:center;gap:6px;background:var(--glow);border:1px solid rgba(249,115,22,.22);border-radius:100px;padding:5px 14px;font-size:10px;font-weight:700;letter-spacing:1.6px;text-transform:uppercase;color:var(--accent);margin-bottom:12px}
  .pill .dot{width:5px;height:5px;border-radius:50%;background:var(--accent);animation:blink 2.2s ease-in-out infinite}
  @keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}
  h1{font-family:'DM Serif Display',Georgia,serif;font-size:28px;font-weight:400;color:#fff;line-height:1.2;margin-bottom:4px}
  h1 em{font-style:normal;color:var(--accent)}
  .sub{font-size:12px;color:var(--dim);font-weight:300}
  .ts{text-align:center;font-size:11px;color:var(--dim);margin-bottom:18px;font-family:'JetBrains Mono',monospace;letter-spacing:.3px}
  .ts .live{color:var(--green);font-weight:600}
  .ts .cached{color:var(--gold);font-weight:600}
  .ts .err{color:var(--red);font-weight:600}
  .card{background:var(--card);border:1px solid var(--border);border-radius:14px;overflow:hidden;box-shadow:0 6px 32px rgba(0,0,0,.45)}
  .hdr{display:flex;padding:12px 14px;font-size:9px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--dim);border-bottom:1px solid var(--border);background:rgba(255,255,255,.015)}
  .hdr .c1{width:42px;text-align:center}.hdr .c2{flex:1}.hdr .c3{width:90px;text-align:right}
  .row{display:flex;align-items:center;padding:13px 14px;transition:background .15s;animation:fadeIn .3s ease both}
  .row:active{background:rgba(255,255,255,.04)}
  .row:not(:last-child){border-bottom:1px solid rgba(255,255,255,.035)}
  @keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
  .rk{width:42px;text-align:center;font-family:'JetBrains Mono',monospace;font-size:12px;font-weight:600;color:var(--dim)}
  .medal{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:7px;font-size:11px}
  .r1{background:rgba(251,191,36,.12);color:var(--gold)}.r2{background:rgba(148,163,184,.1);color:var(--silver)}.r3{background:rgba(217,119,6,.1);color:var(--bronze)}
  .tm{flex:1;display:flex;align-items:center;gap:10px}
  .badge{display:flex;align-items:center;justify-content:center;width:32px;height:32px;border-radius:8px;font-size:10px;font-weight:800;letter-spacing:.3px;flex-shrink:0}
  .name{font-size:13px;font-weight:500;line-height:1.2}
  .name small{display:block;font-size:10px;color:var(--dim);font-weight:400;margin-top:1px}
  .rc{width:90px;display:flex;align-items:center;gap:8px;justify-content:flex-end}
  .bar{width:50px;height:4px;border-radius:2px;background:rgba(255,255,255,.05);overflow:hidden;flex-shrink:0}
  .fill{height:100%;border-radius:2px;background:linear-gradient(90deg,var(--accent),var(--gold));transition:width .6s ease}
  .rv{font-family:'JetBrains Mono',monospace;font-weight:700;font-size:15px;color:#fff;min-width:35px;text-align:right}
  .skel .sh{border-radius:6px;background:rgba(255,255,255,.04);animation:shim 1.5s infinite}
  @keyframes shim{0%{opacity:.4}50%{opacity:.7}100%{opacity:.4}}
  .rbtn{display:block;margin:18px auto 0;padding:8px 20px;background:rgba(249,115,22,.1);border:1px solid rgba(249,115,22,.25);border-radius:9px;color:var(--accent);font-family:'Outfit',sans-serif;font-size:12px;font-weight:600;cursor:pointer;letter-spacing:.3px}
  .rbtn:active{background:rgba(249,115,22,.2)}
  footer{text-align:center;margin-top:22px;font-size:10px;color:var(--dim);font-weight:300;line-height:1.7;letter-spacing:.2px}
  @media(min-width:540px){.w{padding:40px 24px 56px}h1{font-size:34px}.row{padding:15px 18px}.badge{width:36px;height:36px;font-size:11px}.name{font-size:14px}}
</style>
</head>
<body>
<div class="orb oa"></div>
<div class="orb ob"></div>
<div class="w">
  <header>
    <div class="pill"><span class="dot"></span> Season 2026</div>
    <h1>IPL 2026 — Total <em>Runs</em></h1>
    <p class="sub">Aggregate runs scored by each team this season</p>
  </header>
  <div class="ts" id="status"><span class="cached">●</span> Loading…</div>
  <div class="card" id="card"></div>
  <button class="rbtn" id="rbtn" style="display:none" onclick="load()">↻ Refresh Data</button>
  <footer>Data updated in real time from IPL 2026 stats sources.</footer>
</div>
<script>
var TEAM_META={
  'Royal Challengers Bengaluru':{k:'RCB',bg:'#d32a29',c:'#fff'},
  'Sunrisers Hyderabad':{k:'SRH',bg:'#e8570e',c:'#fff'},
  'Chennai Super Kings':{k:'CSK',bg:'#f4c731',c:'#1a1a1a'},
  'Gujarat Titans':{k:'GT',bg:'#1c2c4a',c:'#fff'},
  'Mumbai Indians':{k:'MI',bg:'#004ba0',c:'#fff'},
  'Delhi Capitals':{k:'DC',bg:'#0051a2',c:'#fff'},
  'Rajasthan Royals':{k:'RR',bg:'#ea1a8c',c:'#fff'},
  'Lucknow Super Giants':{k:'LSG',bg:'#a72056',c:'#fff'},
  'Punjab Kings':{k:'PBKS',bg:'#d71920',c:'#fff'},
  'Kolkata Knight Riders':{k:'KKR',bg:'#3a225d',c:'#fff'}
};

var FALLBACK=[
  {team:'Royal Challengers Bengaluru',runs:894,matches:4},
  {team:'Sunrisers Hyderabad',runs:802,matches:4},
  {team:'Chennai Super Kings',runs:755,matches:4},
  {team:'Gujarat Titans',runs:741,matches:4},
  {team:'Mumbai Indians',runs:731,matches:4},
  {team:'Delhi Capitals',runs:707,matches:4},
  {team:'Rajasthan Royals',runs:690,matches:4},
  {team:'Lucknow Super Giants',runs:647,matches:4},
  {team:'Punjab Kings',runs:598,matches:4},
  {team:'Kolkata Knight Riders',runs:562,matches:4}
];

function meta(name){
  if(TEAM_META[name])return TEAM_META[name];
  for(var k in TEAM_META){if(name.indexOf(k.split(' ')[0])>-1)return TEAM_META[k];}
  return{k:name.slice(0,3).toUpperCase(),bg:'#475569',c:'#fff'};
}

function skeleton(){
  var h='<div class="hdr"><div class="c1">#</div><div class="c2">Team</div><div class="c3">Runs</div></div>';
  for(var i=0;i<10;i++){
    h+='<div class="row skel" style="animation-delay:'+i*0.04+'s"><div class="rk"><div class="sh" style="width:20px;height:12px;margin:0 auto"></div></div><div class="tm"><div class="sh" style="width:32px;height:32px;border-radius:8px;flex-shrink:0"></div><div class="sh" style="width:'+(100+Math.random()*80)+'px;height:12px"></div></div><div class="rc"><div class="sh" style="width:50px;height:12px"></div></div></div>';
  }
  document.getElementById('card').innerHTML=h;
}

function render(data,src,ts){
  var st=document.getElementById('status');
  var btn=document.getElementById('rbtn');
  if(src==='cached'){
    st.innerHTML='<span class="cached">●</span> Showing cached data · 12 Apr 2026';
  }else{
    var d=new Date(ts);
    var dStr=d.toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'});
    st.innerHTML='<span class="live">●</span> Live data · Updated '+dStr;
  }
  btn.style.display='block';

  data.sort(function(a,b){return b.runs-a.runs;});
  var max=data[0].runs;

  var h='<div class="hdr"><div class="c1">#</div><div class="c2">Team</div><div class="c3">Runs</div></div>';
  for(var i=0;i<data.length;i++){
    var t=data[i], m=meta(t.team), rank=i+1;
    var pct=((t.runs/max)*100).toFixed(1);
    var rkH;
    if(rank<=3) rkH='<span class="medal r'+rank+'">'+rank+'</span>';
    else rkH=rank;
    var mp=t.matches?t.matches+' match'+(t.matches!==1?'es':'')+' played':'';
    h+='<div class="row" style="animation-delay:'+i*0.04+'s">';
    h+='<div class="rk">'+rkH+'</div>';
    h+='<div class="tm"><span class="badge" style="background:'+m.bg+';color:'+m.c+'">'+m.k+'</span>';
    h+='<span class="name">'+t.team+(mp?'<small>'+mp+'</small>':'')+'</span></div>';
    h+='<div class="rc"><span class="bar"><span class="fill" style="width:'+pct+'%"></span></span>';
    h+='<span class="rv">'+t.runs.toLocaleString()+'</span></div></div>';
  }
  document.getElementById('card').innerHTML=h;
}

function load(){
  skeleton();
  document.getElementById('status').innerHTML='<span class="cached">●</span> Fetching latest data…';
  document.getElementById('rbtn').style.display='none';

  // The API endpoint — change this to your deployed URL
  var apiUrl=window.location.origin+'/api/stats';

  fetch(apiUrl).then(function(r){return r.json();}).then(function(j){
    if(j.success && j.data && j.data.length>=5){
      render(j.data, j.source, j.updated);
    }else{
      render(FALLBACK,'cached',null);
    }
  }).catch(function(){
    render(FALLBACK,'cached',null);
  });
}

load();
</script>
</body>
</html>
